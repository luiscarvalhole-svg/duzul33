name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Baixar os arquivos
        uses: actions/checkout@v4

      - name: Descompactar as imagens do jogo
        run: unzip -q -o assets_pack.zip

      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar as ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install cython==0.29.36 buildozer

      - name: Gerar o APK
        run: yes | buildozer -v android debug

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: FazendaRPG-apk
          path: bin/*.apk
